spring.application.name=campus-secondhand
# ---- 应用 ----
spring.datasource.url=jdbc:mysql://localhost:3306/campus_secondhand?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Mail（敏感项走环境变量，缺失时启动即报错，避免误发）
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT 配置
jwt.secret=${JWT_SECRET}
jwt.expiration=86400

# 服务器配置
server.port=8080
# 上传限制：图片改走 multipart 落盘、数据库只存路径后，JSON 请求体里不再有 base64，
# 因此不需要为它预留 50MB。单张图片 <= 5MB（与 app.upload.max-bytes 一致），
# 整个请求 <= 10MB（给表单字段留出余量）。
# 上限从 2MB 抬到 5MB：支付宝学生认证截图（手机截屏 PNG）普遍 1~3MB，
# 2MB 会拦截大量合法截图；该上限同时作用于商品图等所有图片上传。
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# Tomcat 侧同步收敛：否则 Spring 拒绝了，Tomcat 还是会把 50MB 先吞进内存
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-post-size=10MB

# 日志配置
# SQL 日志不在此开启：原值 logging.level.com.example.wastereuseplatform 包名写错
# （真实包为 campussecondhand），是一条永不生效的死配置。
# 需要查看分页 SQL 是否带 LIMIT 时，用 dev/local profile 启动，见 application-dev.properties。

# 启动时自动执行的 SQL 脚本。
# mode=always 只会在启动时执行下面 schema-locations 指定的 plaza-schema.sql 这一个文件，
# 其余 migration-*.sql 一概不自动跑（项目没有 Flyway），必须在数据库上手工执行；
# 这条注释此前写着"设为 never"，与实际的 always 相反，是直接误导人的。
# continue-on-error=true 是必需的而非随手打开：plaza-schema.sql 里的 ALTER TABLE
# 不幂等，第二次启动必然报 Duplicate column name；置为 false 会让服务直接起不来。
# 要让脚本幂等、从而关掉 continue-on-error，得先把那条 ALTER 改成查 information_schema 再执行。
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:plaza-schema.sql


# ============================ 订单与支付 ============================
# 订单支付有效期（分钟）。下单时据此计算 orders.expire_time，
# 收银台倒计时、支付接口过期检查、定时任务扫描三处共用该口径。
# 注意：修改后仅影响新下单的订单，已有订单保留其原有 expire_time。
order.pay-timeout-minutes=30

# 超时订单定时扫描间隔（毫秒），默认 5 分钟
order.timeout-scan-interval-ms=300000

# 发货后自动确认收货天数。二手交易没有物流签收时间，只能按卖家发货时间计算；
# <=0 表示关闭自动确认，完全不扫描。手动确认收货不受影响。
order.auto-confirm-days=7
# 自动确认扫描间隔（毫秒），默认 1 小时
order.auto-confirm-scan-interval-ms=3600000
order.auto-confirm-initial-delay-ms=60000

# 支付渠道。mock=本地模拟（永远成功）；接入真实渠道时新增实现类并改此值
payment.channel=mock

# ============================ 图片上传（P1-12） ============================
# 图片落盘根目录（相对后端模块工作目录）。数据库只存 /uploads/yyyy/MM/xxx.jpg 路径，
# 不再把 base64 塞进 products.images / posts.images / users.avatar。
# 该目录已加入 .gitignore：它是运行期数据，不属于源码。
app.upload.dir=uploads
# 单张图片大小上限（字节）。截图认证要求不超过 5MB，与 multipart 上限同步
app.upload.max-bytes=5242880
# 认证截图的私有落盘目录。该目录【不】注册静态资源映射，
# 没有 URL 能直接取到，只能经带鉴权的管理端接口按申请记录读取。
app.upload.proof-dir=uploads-private
